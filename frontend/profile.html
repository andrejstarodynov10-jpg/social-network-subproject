<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Профиль</h1>
        <nav>
            <a href="feed.html">← Лента</a>
            <span>|</span>
            <a id="my-profile-link" href="profile.html">Мой профиль</a>
            <button id="logout-button" type="button">Выйти</button>
        </nav>
    </header>

    <div id="message"></div>

    <section>
        <h1 id="profile-display-name">Загрузка...</h1>
        <p>@<span id="profile-username"></span></p>
        <p id="profile-bio"></p>
    </section>

    <section id="edit-profile-section" hidden>
        <h3>Редактировать профиль</h3>
        <form id="edit-profile-form">
            <label for="edit-display-name">Имя:</label>
            <input type="text" id="edit-display-name" maxlength="50" placeholder="Ваше имя">

            <label for="edit-bio">О себе (bio):</label>
            <textarea id="edit-bio" maxlength="300" placeholder="Расскажите о себе..."></textarea>

            <button type="submit">Сохранить</button>
        </form>
    </section>

    <main>
        <h2>Посты пользователя</h2>
        <div id="user-posts-list"></div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
