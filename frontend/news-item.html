<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новость</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Новости</h1>
        <nav>
            <a href="feed.html">Лента</a>
            <a href="news.html">Новости</a>
            <a id="my-profile-link" href="profile.html">Мой профиль</a>
            <a id="admin-link" href="admin.html" hidden>Админ-панель</a>
            <button id="logout-button" type="button">Выйти</button>
        </nav>
    </header>

    <div id="message"></div>

    <main>
        <article id="news-detail">
            <h2 id="news-title">Загрузка...</h2>
            <small id="news-meta"></small>
            <img id="news-image" hidden alt="Изображение новости">
            <p id="news-text"></p>

            <!-- Блок комментариев (аналогично структуре в api.js) -->
            <div id="news-comments-section" hidden>
                <div id="news-comments-list"></div>
                <form id="news-comment-form">
                    <input type="text" id="news-comment-input" placeholder="Написать комментарий..." required maxlength="1000">
                    <button type="submit">Отправить</button>
                </form>
            </div>
        </article>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/news-item.js"></script>
</body>
</html>
