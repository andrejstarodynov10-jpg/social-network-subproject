<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Кнопка переключения между формами (логика в js/auth.js) -->
    <button type="button" id="toggle-button">Перейти к регистрации</button>

    <!-- Форма входа -->
    <form id="login-form">
        <h3>Вход</h3>
        <input type="text" id="login-username" placeholder="Логин" required>
        <input type="password" id="login-password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
    </form>

    <!-- Форма регистрации (скрыта, пока не нажата кнопка переключения) -->
    <form id="register-form" hidden>
        <h3>Регистрация</h3>
        <input type="text" id="register-username" placeholder="Логин (латиница, цифры, _)"
               required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+">
        <input type="text" id="register-display-name" placeholder="Имя (необязательно)" maxlength="50">
        <input type="password" id="register-password" placeholder="Пароль (от 8 символов)"
               required minlength="8" maxlength="128">
        <button type="submit">Зарегистрироваться</button>
    </form>

    <!-- Сюда выводятся сообщения об ошибках -->
    <p id="message"></p>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
